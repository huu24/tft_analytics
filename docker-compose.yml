  # ── Backend API ──
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tft-backend
    networks:
      - tft-network
    environment:
      ES_HOST: elasticsearch
      ES_PORT: 9200
      KAFKA_BROKER: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      AIRFLOW_URL: http://airflow-webserver:8080
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tft-frontend
    networks:
      - tft-network
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── ML Training ──
  ml-training:
    build:
      context: .
      dockerfile: ml/Dockerfile
    container_name: tft-ml-training
    networks:
      - tft-network
    environment:
      ES_HOST: elasticsearch
      ES_PORT: 9200
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - ml-checkpoints:/app/ml/checkpoints
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── TFT Auto Crawler ──
  crawler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tft-crawler
    networks:
      - tft-network
    volumes:
      - ./puuids.json:/app/puuids.json
      - ./match_data.json:/app/match_data.json
      - ./tft_crawler_auto.py:/app/tft_crawler_auto.py
    environment:
      API_KEY: ${API_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse-bucket}
    depends_on:
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: python -u tft_crawler_auto.py

networks:
  tft-network:
    driver: bridge

volumes:
  es-data:
  minio-data:
  pg-data:
  airflow-logs:
  ml-checkpoints:
