version: "3.8"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: tft-airflow-spark:2.8.1
  env_file: .env
  networks:
    - tft-network
  environment:
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CELERY__BROKER_URL: redis://:${REDIS_PASSWORD:-}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
    _PIP_ADDITIONAL_REQUIREMENTS: "kafka-python-ng elasticsearch minio pyspark==3.5.1"
  volumes:
    - ./etl/dags:/opt/airflow/dags
    - ./etl/config:/opt/airflow/config
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ── Elasticsearch ──
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: tft-elasticsearch
    networks:
      - tft-network
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

#   # ── Kibana ──
#   kibana:
#     image: docker.elastic.co/kibana/kibana:8.13.0
#     container_name: tft-kibana
#     networks:
#       - tft-network
#     environment:
#       - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
#     ports:
#       - "5601:5601"
#     depends_on:
#       elasticsearch:
#         condition: service_healthy
#     healthcheck:
#       test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q 'available'"]
#       interval: 15s
#       timeout: 10s
#       retries: 10
#       start_period: 30s

  # ── MinIO (S3-compatible storage) ──
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: tft-minio
    networks:
      - tft-network
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MinIO Bucket Init ──
  minio-init:
    image: minio/mc:latest
    container_name: tft-minio-init
    networks:
      - tft-network
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set tftminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing tftminio/$${MINIO_BUCKET};
      echo 'Bucket created successfully';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse-bucket}
    restart: "no"

  # ── Redis (Celery Broker) ──
  redis:
    image: redis:7-alpine
    container_name: tft-redis
    networks:
      - tft-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PostgreSQL (Airflow Metadata) ──
  postgres:
    image: postgres:16-alpine
    container_name: tft-postgres
    networks:
      - tft-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Airflow Webserver ──
  airflow-webserver:
    <<: *airflow-common
    container_name: tft-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/health | grep -q 'healthy'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Airflow Scheduler ──
  airflow-scheduler:
    <<: *airflow-common
    container_name: tft-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$(hostname)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Airflow Worker ──
  airflow-worker:
    <<: *airflow-common
    container_name: tft-airflow-worker
    command: celery worker
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d celery@$${HOSTNAME}"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Airflow Init (one-time setup) ──
  airflow-init:
    <<: *airflow-common
    container_name: tft-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username ${AIRFLOW_ADMIN_USERNAME} \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --email ${AIRFLOW_ADMIN_EMAIL} \
          --firstname Admin \
          --lastname User \
          --role Admin || true
    restart: "no"

